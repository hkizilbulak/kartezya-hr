host: localhost:8080
info:
  contact:
    email: support@kartezya.com
    name: API Support
  description: |-
    This is a comprehensive HR Management System API built with Go and Gin framework.
    It provides endpoints for managing employees, leave requests, companies, departments, and more.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Kartezya HR Management System API
  version: "1.0"
paths:
  /api/reports/contract:
    get:
      consumes:
      - application/json
      description: Get contract report with filters
      parameters:
      - description: Company ID
        in: query
        name: company_id
        type: integer
      - collectionFormat: csv
        description: Department IDs (supports repeated param or comma separated)
        in: query
        items:
          type: integer
        name: department_ids
        type: array
      - description: Is Active (true or false)
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ContractReportResponse'
      summary: Get Contract Report
      tags:
      - reports
  /api/reports/contract/export/excel:
    post:
      consumes:
      - application/json
      description: Creates an Excel file and downloads it
      parameters:
      - description: Export Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.ContractReportExportRequest'
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: sozlesme_raporu.xlsx
          schema:
            type: file
      summary: Export Contract Report to Excel
      tags:
      - reports
  /api/reports/grade:
    get:
      consumes:
      - application/json
      description: Get employee count grouped by grade with optional company and department
        filters (Admin only)
      parameters:
      - description: Filter by company ID
        in: query
        name: company_id
        type: integer
      - description: Filter by department ID
        in: query
        name: department_id
        type: integer
      - collectionFormat: csv
        description: Department IDs (supports repeated param or comma separated)
        in: query
        items:
          type: integer
        name: department_ids
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GradeReportResponse'
      security:
      - BearerAuth: []
      summary: Get grade distribution report
      tags:
      - reports
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for the authenticated user
      parameters:
      - description: Password change request
        in: body
        name: changePasswordRequest
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Change user password (authenticated)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using a valid password reset token
      parameters:
      - description: Password reset request
        in: body
        name: resetPasswordRequest
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: Reset user password with token
      tags:
      - auth
  /auth/send-password-reset-email-batch:
    post:
      consumes:
      - application/json
      description: Send password reset emails to a batch of users
      parameters:
      - description: Batch password reset email request
        in: body
        name: batchRequest
        required: true
        schema:
          $ref: '#/definitions/handler.SendPasswordResetEmailBatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.SendPasswordResetEmailBatchResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Send password reset emails to multiple users
      tags:
      - auth
  /auth/validate-reset-token:
    post:
      consumes:
      - application/json
      description: Validate if a password reset token is valid and not expired
      parameters:
      - description: Token validation request
        in: body
        name: validateResetTokenRequest
        required: true
        schema:
          $ref: '#/definitions/handler.ValidateResetTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: Validate password reset token
      tags:
      - auth
  /auth/yandex/callback:
    get:
      consumes:
      - application/json
      description: Handles the OAuth callback from Yandex and authenticates the user
      parameters:
      - description: Authorization code from Yandex
        in: query
        name: code
        required: true
        type: string
      - description: State parameter for CSRF protection
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: Handle Yandex OAuth callback
      tags:
      - auth
  /auth/yandex/login:
    get:
      consumes:
      - application/json
      description: Redirects the user to Yandex OAuth authorization page
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Yandex OAuth
          schema:
            type: string
      summary: Initiate Yandex OAuth login
      tags:
      - auth
  /companies:
    get:
      consumes:
      - application/json
      description: Get paginated list of companies with sorting (Admin only)
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
